version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: bee_pos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bee_pos
      POSTGRES_USER: beeuser
      POSTGRES_PASSWORD: bee123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bee_pos_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bee_pos
      SPRING_DATASOURCE_USERNAME: beeuser
      SPRING_DATASOURCE_PASSWORD: bee123
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bee_pos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
