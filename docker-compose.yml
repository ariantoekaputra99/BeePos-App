# Local / VPS stack. Copy .env.example to .env and change the secrets before exposing it publicly.
services:
  postgres:
    image: postgres:16
    container_name: bee_pos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bee_pos}
      POSTGRES_USER: ${POSTGRES_USER:-beeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bee123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beeuser} -d ${POSTGRES_DB:-bee_pos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bee_pos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bee_pos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-beeuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bee123}
      JWT_SECRET: ${JWT_SECRET:-bee-pos-development-secret-key-must-be-at-least-32-bytes}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}
      APP_STORE_NAME: ${STORE_NAME:-BeePos Store}
      APP_STORE_ADDRESS: ${STORE_ADDRESS:-}
      APP_UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_STORE_NAME: ${STORE_NAME:-BeePos Store}
        VITE_STORE_ADDRESS: ${STORE_ADDRESS:-}
    container_name: bee_pos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  postgres_data:
  uploads_data:
