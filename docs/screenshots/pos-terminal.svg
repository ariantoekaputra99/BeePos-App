<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">BeePos POS Terminal preview</title>
  <desc id="desc">Preview of the BeePos retail point of sale interface with product grid, search and shopping cart.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <style>
      .text{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.muted{font-family:Inter,Arial,sans-serif;fill:#94a3b8}.small{font-family:Inter,Arial,sans-serif;font-size:14px;fill:#94a3b8}.card{fill:#0f172a;stroke:#1e293b;stroke-width:1}.line{stroke:#1e293b;stroke-width:1}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#020617"/>
  <rect width="250" height="900" fill="#0f172a"/>
  <text x="32" y="55" class="small" fill="#fbbf24">B E E P O S</text>
  <text x="32" y="91" class="text" font-size="26" font-weight="700">Retail OS</text>
  <rect x="20" y="130" width="210" height="50" rx="12" fill="url(#accent)"/><text x="42" y="161" font-size="15" font-family="Inter,Arial" font-weight="700" fill="#020617">POS Terminal</text>
  <text x="42" y="220" class="muted" font-size="15">Dashboard</text><text x="42" y="268" class="muted" font-size="15">Produk</text><text x="42" y="316" class="muted" font-size="15">Inventori</text><text x="42" y="364" class="muted" font-size="15">Laporan</text>
  <rect x="20" y="810" width="210" height="62" rx="12" fill="#020617" stroke="#334155"/><text x="38" y="835" class="small">Signed in as</text><text x="38" y="857" class="text" font-size="15" font-weight="600">Admin</text>
  <text x="290" y="48" class="muted" font-size="14">Good morning, Admin</text><text x="290" y="82" class="text" font-size="28" font-weight="700">POS Terminal</text><rect x="1220" y="40" width="150" height="30" rx="15" fill="#064e3b"/><text x="1240" y="60" font-size="12" font-family="Inter,Arial" fill="#6ee7b7">● System online</text>
  <line x1="250" y1="110" x2="1440" y2="110" class="line"/>
  <rect x="290" y="145" width="220" height="100" rx="16" class="card"/><text x="312" y="176" class="small">Penjualan hari ini</text><text x="312" y="215" class="text" font-size="23" font-weight="700">Rp 14.250.000</text>
  <rect x="530" y="145" width="220" height="100" rx="16" class="card"/><text x="552" y="176" class="small">Transaksi</text><text x="552" y="215" class="text" font-size="23" font-weight="700">268</text>
  <rect x="770" y="145" width="220" height="100" rx="16" class="card"/><text x="792" y="176" class="small">Stok menipis</text><text x="792" y="215" font-size="23" font-family="Inter,Arial" font-weight="700" fill="#fda4af">2</text>
  <text x="290" y="305" class="text" font-size="21" font-weight="700">Pilih produk</text><text x="290" y="330" class="small">Klik produk untuk menambahkan ke keranjang</text><rect x="660" y="285" width="330" height="46" rx="11" class="card"/><text x="682" y="313" class="small">Cari produk atau SKU...</text>
  <g><rect x="290" y="365" width="210" height="190" rx="16" class="card"/><rect x="310" y="385" width="70" height="24" rx="12" fill="#1e293b"/><text x="324" y="402" font-size="11" font-family="Inter,Arial" fill="#cbd5e1">Sembako</text><text x="310" y="455" class="text" font-size="15" font-weight="600">Beras Premium 5kg</text><text x="310" y="480" class="small">BR-005 · 24 stok</text><text x="310" y="525" font-size="16" font-family="Inter,Arial" font-weight="700" fill="#fcd34d">Rp 72.000</text></g>
  <g><rect x="520" y="365" width="210" height="190" rx="16" class="card"/><rect x="540" y="385" width="70" height="24" rx="12" fill="#1e293b"/><text x="554" y="402" font-size="11" font-family="Inter,Arial" fill="#cbd5e1">Sembako</text><text x="540" y="455" class="text" font-size="15" font-weight="600">Minyak Goreng 2L</text><text x="540" y="480" class="small">MG-002 · 16 stok</text><text x="540" y="525" font-size="16" font-family="Inter,Arial" font-weight="700" fill="#fcd34d">Rp 34.000</text></g>
  <g><rect x="750" y="365" width="210" height="190" rx="16" class="card"/><rect x="770" y="385" width="70" height="24" rx="12" fill="#1e293b"/><text x="784" y="402" font-size="11" font-family="Inter,Arial" fill="#cbd5e1">Minuman</text><text x="770" y="455" class="text" font-size="15" font-weight="600">Coca Cola 1L</text><text x="770" y="480" class="small">CC-001 · 42 stok</text><text x="770" y="525" font-size="16" font-family="Inter,Arial" font-weight="700" fill="#fcd34d">Rp 18.000</text></g>
  <rect x="1015" y="145" width="385" height="600" rx="16" class="card"/><text x="1040" y="185" class="text" font-size="21" font-weight="700">Keranjang</text><text x="1040" y="211" class="small">2 jenis produk</text><text x="1322" y="185" font-size="12" font-family="Inter,Arial" fill="#fda4af">Kosongkan</text>
  <rect x="1040" y="245" width="335" height="90" rx="12" fill="#020617"/><text x="1060" y="275" class="text" font-size="14" font-weight="600">Beras Premium 5kg</text><text x="1060" y="303" class="small">Rp 72.000 × 1</text><text x="1260" y="275" font-size="14" font-family="Inter,Arial" font-weight="600" fill="#fcd34d">Rp 72.000</text>
  <rect x="1040" y="350" width="335" height="90" rx="12" fill="#020617"/><text x="1060" y="380" class="text" font-size="14" font-weight="600">Minyak Goreng 2L</text><text x="1060" y="408" class="small">Rp 34.000 × 1</text><text x="1260" y="380" font-size="14" font-family="Inter,Arial" font-weight="600" fill="#fcd34d">Rp 34.000</text>
  <line x1="1040" y1="625" x2="1375" y2="625" class="line"/><text x="1040" y="660" class="small">Subtotal</text><text x="1280" y="660" class="text" font-size="14">Rp 106.000</text><text x="1040" y="700" class="text" font-size="18" font-weight="700">Total</text><text x="1245" y="700" font-size="19" font-family="Inter,Arial" font-weight="700" fill="#fcd34d">Rp 106.000</text><rect x="1040" y="715" width="335" height="0" fill="#fbbf24"/>
</svg>
