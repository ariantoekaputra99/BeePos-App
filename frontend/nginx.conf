server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Resolving per request (via a variable) means nginx keeps working
    # after the backend container restarts and gets a new IP, instead of returning 502 forever.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # API is proxied to the Spring Boot container, so browser and API share one origin (no CORS needed).
    location /api/ {
        proxy_pass $backend_upstream;
        # Browser and API share this origin, so CORS does not apply. Dropping Origin stops Spring
        # from rejecting requests with "403 Invalid CORS request" when APP_CORS_ALLOWED_ORIGINS
        # does not list the URL the app is opened on (e.g. http://localhost:8081 or a LAN IP).
        # Safe because auth uses a Bearer token header, not cookies.
        proxy_set_header Origin "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 5m;  # product image uploads (backend limit is 2 MB)
    }

    # Friendly JSON instead of nginx's HTML page while the backend is starting or down.
    error_page 502 503 504 = @backend_down;
    location @backend_down {
        default_type application/json;
        return 503 '{"status":503,"message":"Server sedang dimulai atau tidak berjalan. Coba lagi beberapa saat lagi."}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
